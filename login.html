<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .verify-group {
            display: flex;
            gap: 10px;
        }

        .verify-group input {
            flex: 1;
        }

        .verify-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .verify-btn:hover {
            background: #5a67d8;
        }

        .verify-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .links {
            margin-top: 20px;
            text-align: center;
            display: flex;
            justify-content: space-between;
        }

        .links a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .divider {
            margin: 30px 0;
            text-align: center;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #ddd;
        }

        .divider span {
            background: white;
            padding: 0 10px;
            color: #666;
            font-size: 14px;
            position: relative;
        }

        .third-party-login {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .third-party-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .third-party-btn:hover {
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>欢迎登录</h1>
            <p>使用手机号验证码快速登录</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" placeholder="请输入手机号" required pattern="^1[3-9]\d{9}$">
            </div>

            <div class="form-group">
                <label for="verifyCode">验证码</label>
                <div class="verify-group">
                    <input type="text" id="verifyCode" placeholder="请输入验证码" required pattern="^\d{6}$">
                    <button type="button" class="verify-btn" id="verifyBtn">获取验证码</button>
                </div>
            </div>

            <button type="submit" class="login-btn">登录</button>
        </form>

        <div class="links">
            <a href="#" id="forgetPassword">忘记密码？</a>
            <a href="#" id="register">立即注册</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('phone');
            const verifyBtn = document.getElementById('verifyBtn');
            const verifyCodeInput = document.getElementById('verifyCode');
            const loginForm = document.getElementById('loginForm');
            const forgetPassword = document.getElementById('forgetPassword');
            const register = document.getElementById('register');

            let countdown = 0;
            let timer = null;

            // 验证手机号格式
            function validatePhone(phone) {
                const regex = /^1[3-9]\d{9}$/;
                return regex.test(phone);
            }

            // 获取验证码
            verifyBtn.addEventListener('click', function() {
                const phone = phoneInput.value.trim();

                if (!validatePhone(phone)) {
                    alert('请输入正确的手机号');
                    return;
                }

                if (countdown > 0) return;

                // 模拟发送验证码
                alert('验证码已发送到您的手机');

                // 开始倒计时
                countdown = 60;
                verifyBtn.textContent = `${countdown}s`;
                verifyBtn.disabled = true;

                timer = setInterval(() => {
                    countdown--;
                    verifyBtn.textContent = `${countdown}s`;

                    if (countdown <= 0) {
                        clearInterval(timer);
                        verifyBtn.textContent = '获取验证码';
                        verifyBtn.disabled = false;
                    }
                }, 1000);
            });

            // 表单提交
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const phone = phoneInput.value.trim();
                const verifyCode = verifyCodeInput.value.trim();

                if (!validatePhone(phone)) {
                    alert('请输入正确的手机号');
                    return;
                }

                if (!/^\d{6}$/.test(verifyCode)) {
                    alert('请输入6位验证码');
                    return;
                }

                // 模拟登录
                alert('登录成功！');
                console.log('登录信息：', { phone, verifyCode });
            });

            // 忘记密码
            forgetPassword.addEventListener('click', function(e) {
                e.preventDefault();
                alert('忘记密码功能请通过客服找回');
            });

            // 注册
            register.addEventListener('click', function(e) {
                e.preventDefault();
                alert('注册功能即将开放，敬请期待');
            });

            // 输入框限制
            verifyCodeInput.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '').slice(0, 6);
            });
        });
    </script>
</body>
</html>
